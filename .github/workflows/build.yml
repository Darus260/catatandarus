name: Build WebView APK (Hybrid)

on:
  workflow_dispatch:
    inputs:
      appName:
        description: 'Nama Aplikasi'
        required: true
      mode:
        description: 'Mode Build (online / offline)'
        required: true
      webUrl:
        description: 'URL Website (untuk mode online)'
        required: false
      feZipUrl:
        description: 'URL ZIP Frontend (untuk mode offline)'
        required: false
      logoUrl:
        description: 'URL Logo'
        required: true
      buildTag:
        description: 'Tag Unik'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Configuration
        run: |
          # 1. Setup ID Aplikasi
          CLEAN_ID=$(echo "${{ github.event.inputs.appName }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
          sed -i "s/applicationId \".*\"/applicationId \"com.$CLEAN_ID\"/g" app/build.gradle
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">${{ github.event.inputs.appName }}<\/string>/g' app/src/main/res/values/strings.xml
          
          # 2. Logika Pemisahan Menu
          if [ "${{ github.event.inputs.mode }}" == "offline" ]; then
            echo "🔧 Memproses Mode Offline (ZIP)..."
            sed -i 's|private String targetUrl = ".*";|private String targetUrl = "file:///android_asset/index.html";|g' app/src/main/java/com/contoh/webview/MainActivity.java
            mkdir -p app/src/main/assets
            wget -O fe_assets.zip "${{ github.event.inputs.feZipUrl }}"
            unzip fe_assets.zip -d app/src/main/assets/
          else
            echo "🌐 Memproses Mode Online (Web URL)..."
            sed -i 's|private String targetUrl = ".*";|private String targetUrl = "${{ github.event.inputs.webUrl }}";|g' app/src/main/java/com/contoh/webview/MainActivity.java
          fi

          # 3. Setup Logo
          wget -O app_icon.png "${{ github.event.inputs.logoUrl }}"
          # ... (Logika cp logo ke mipmap seperti sebelumnya)

      - name: Setup Java & Build
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Create Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.buildTag }}
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
