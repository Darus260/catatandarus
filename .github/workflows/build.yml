name: Build WebView APK (Pro Generator)

on:
  workflow_dispatch:
    inputs:
      appName: { required: true, description: 'Nama Aplikasi' }
      packageName: { required: true, description: 'Contoh: com.bisnis.anda' }
      versionName: { required: true, default: '1.0' }
      versionCode: { required: true, default: '1' }
      rotation: { required: true, default: 'unspecified' } # portrait, landscape, unspecified
      fullScreen: { required: true, default: 'false' }
      hideTitleBar: { required: true, default: 'false' }
      allowZoom: { required: true, default: 'true' }
      pcMode: { required: true, default: 'false' }
      swipeRefresh: { required: true, default: 'true' }
      # ... tambahkan input lainnya sesuai kebutuhan ...

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Pro Configuration
        run: |
          # 1. Update Gradle (Package, Version Code/Name)
          sed -i "s/applicationId \".*\"/applicationId \"${{ github.event.inputs.packageName }}\"/g" app/build.gradle
          sed -i "s/versionCode .*/versionCode ${{ github.event.inputs.versionCode }}/g" app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ github.event.inputs.versionName }}\"/g" app/build.gradle
          
          # 2. Update Strings (App Name)
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ github.event.inputs.appName }}</string>|g" app/src/main/res/values/strings.xml
          
          # 3. Update AndroidManifest (Rotation)
          sed -i "s/android:screenOrientation=\".*\"/android:screenOrientation=\"${{ github.event.inputs.rotation }}\"/g" app/src/main/AndroidManifest.xml

          # 4. Inject Boolean Settings ke MainActivity.java
          sed -i "s/boolean isFullScreen = .*; \/\/ \[SET_FS\]/boolean isFullScreen = ${{ github.event.inputs.fullScreen }}; \/\/ \[SET_FS\]/g" app/src/main/java/com/contoh/webview/MainActivity.java
          sed -i "s/boolean hideTitle = .*; \/\/ \[SET_HT\]/boolean hideTitle = ${{ github.event.inputs.hideTitleBar }}; \/\/ \[SET_HT\]/g" app/src/main/java/com/contoh/webview/MainActivity.java
          sed -i "s/boolean pcMode = .*; \/\/ \[SET_PC\]/boolean pcMode = ${{ github.event.inputs.pcMode }}; \/\/ \[SET_PC\]/g" app/src/main/java/com/contoh/webview/MainActivity.java

      # ... (Lanjutkan dengan Setup Java & Build seperti kode sebelumnya) ...
